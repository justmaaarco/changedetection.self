name = "ps5-pro-uk-restocks"
main = "worker.mjs"
compatibility_date = "2026-11-20"
workers_dev = false
preview_urls = false
keep_vars = true

[triggers]
crons = ["* * * * *"]

[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = false

[[durable_objects.bindings]]
name = "MONITOR"
class_name = "RestockMonitor"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RestockMonitor"]

[[send_email]]
name = "EMAIL"
